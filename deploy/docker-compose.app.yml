# NoCode Editor — một app, một image (SPA + /api + /auth cùng origin).
# KHÔNG chứa secret: mọi giá trị nhạy cảm nằm ở ./.env (gitignored).
#
# deploy.sh truyền COLOR=blue|green. Compose tự đọc ./.env để nội suy ${NOCODE_IMAGE}.
services:
  app:
    image: ${NOCODE_IMAGE}
    container_name: nocode-app-${COLOR}
    restart: unless-stopped
    env_file: .env
    # Không map port ra host — chỉ Caddy (cùng network bmik_net) thấy được.
    expose:
      - "8080"
    healthcheck:
      # node:22-alpine có busybox wget, KHÔNG có curl. /healthz trả 200 khi chưa login.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 20s
    logging:
      # Mặc định json-file không giới hạn → vài tháng là đầy disk Lightsail.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      edge: {}

networks:
  edge:
    external: true
    name: bmik_net
